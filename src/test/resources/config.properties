# ============================================================
# Framework configuration
#
# ConfigReader looks for each key in this order (first match wins):
#   1. -Dkey=value on the Maven command line
#   2. Environment variable BOOKSTORE_<KEY>   e.g. BOOKSTORE_USERNAME
#      (prefixed because Windows already defines USERNAME)
#   3. This file
#
# No credentials in this file - it will be in a public repo.
# Set them as environment variables instead (PowerShell, once):
#   setx BOOKSTORE_USERNAME "your_demoqa_user"
#   setx BOOKSTORE_PASSWORD "your_demoqa_password"
# then restart IntelliJ so it picks them up.
# ============================================================

# ── Browser ─────────────────────────────────────────────────
# chrome | firefox | edge
browser=chrome
headless=false

# ── Page loading ────────────────────────────────────────────
# normal = driver.get() waits for EVERY resource, ads included
# eager  = driver.get() returns once the HTML is ready (recommended for DemoQA,
#          whose ad servers can stall a normal load for a minute)
pageLoadStrategy=eager
# Chrome/Edge: refuse requests to Google ad/tracking domains (see DriverFactory)
blockAds=true
# Chrome/Edge: keep downloaded files in a shared cache folder
# (~/.bookstore-automation/browser-cache) so DemoQA's slow 899 KB app bundle is
# only downloaded once, not once per scenario. Cookies are NOT shared.
browserCache=true

# ── Application under test ──────────────────────────────────
baseUrl=https://demoqa.com
loginUrl=https://demoqa.com/login
booksUrl=https://demoqa.com/books
profileUrl=https://demoqa.com/profile

# ── Timeouts (seconds) ──────────────────────────────────────
# No implicit wait - every wait is explicit (Framework-Design.md, D4)
explicitWait=20
# For "should NOT appear" checks, so a negative check doesn't cost 20s
shortWait=5
# 120s so a slow FIRST load (before the cache has DemoQA's files) can finish
pageLoadTimeout=120
